# Configuracion de Cloudflare Pages. Existe por una razon: las funciones de
# functions/ y sus dos bindings (D1 y R2). Sin este fichero, "wrangler pages deploy"
# sube el sitio estatico y deja la API fuera.
#
# Los ids salen de crear los recursos una vez, ver PUBLICAR.md paso 9.
name = "fitnesssupplementwiki"
compatibility_date = "2026-08-28"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "suplementos"
database_id = "e0338f15-7d09-42a0-9752-d5960df754fa"

# El binding se llama FOTOS y no "suplementos_fotos" como sugiere wrangler al crear el
# bucket: en la API es `env.FOTOS`, y el nombre del binding es el contrato entre las dos
# cosas. Si se cambia aqui, hay que cambiarlo en functions/api/[[ruta]].js.
[[r2_buckets]]
binding = "FOTOS"
bucket_name = "suplementos-fotos"

# SECRETO no se escribe aqui: es un secreto y este fichero va a git.
#   npx wrangler pages secret put SECRETO
# En local vive en web/.dev.vars, que esta en .gitignore.
